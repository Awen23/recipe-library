name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run that's now out of date.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      # Actions are pinned to a commit SHA, because a tag can be moved to other code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            api/pyproject.toml
            api/requirements.txt

      # The runtime dependencies come from the hashed lock file, so CI tests the same
      # versions the Docker image ships. Hashes are checked for everything in one pip
      # call, so the app and the dev tools (which have no hashes) are installed after.
      - name: Install locked runtime dependencies
        run: pip install --require-hashes -r requirements.txt
      - name: Install the app and dev tools
        run: |
          pip install --no-deps -e .
          pip install --group dev

      - name: Check formatting
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
