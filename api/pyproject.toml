[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-library"
version = "0.1.0"
description = "A searchable library of the recipes in a YouTube cooking playlist."
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20",
    "anthropic>=2.12,<3",
    "httpx2>=2.16",
    "python-dotenv>=1.2",
    "recipe-scrapers>=15.14,<16",
    "sqlalchemy>=2.1",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
recipes = "recipes.entrypoints.cli:main"  # the `recipes` command

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff==0.17.6",  # keep equal to `rev` in .pre-commit-config.yaml
    "mypy",
    "pip-tools",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recipes"]

[tool.alembic]
script_location = "%(here)s/migrations"

# Tidy each new migration file so it passes the same checks as the rest of the code.
[[tool.alembic.post_write_hooks]]
name = "ruff_format"  # first, so the check below doesn't report long lines
type = "module"
module = "ruff"
options = "format --quiet REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_fix"  # removes the imports an empty migration doesn't use
type = "module"
module = "ruff"
options = "check --fix --quiet REVISION_SCRIPT_FILENAME"

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import helpers from tests/fakes.py
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["fakes"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests", "migrations"]
