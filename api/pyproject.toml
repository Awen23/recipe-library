[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "recipe-library"
version = "0.1.0"
description = "A searchable library of the recipes in a YouTube cooking playlist."
requires-python = ">=3.14"
dependencies = ["httpx>=0.28"]
classifiers = ["Private :: Do Not Upload"]

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff",
    "mypy",
    "pip-tools",
]

[tool.hatch.build.targets.wheel]
packages = ["src/recipes"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["tests"]  # lets tests import helpers from tests/fakes.py
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-local-folder = ["fakes"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
